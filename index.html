<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d71920">
<title>When Stars Collide — Comic Reader</title>
<style>
:root{
  --ink:#0c0c10;
  --paper:#f5edd6;
  --cream:#fff7df;
  --red:#d71920;
  --red2:#8b0d12;
  --yellow:#ffd43b;
  --blue:#183a78;
  --navy:#07101f;
  --muted:#c8c2b4;
  --panel:#11131a;
  --edge:#242834;
  --shadow:0 20px 60px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
  radial-gradient(circle at 20% 10%, rgba(215,25,32,.18), transparent 30%),
  radial-gradient(circle at 80% 0%, rgba(255,212,59,.10), transparent 28%),
  linear-gradient(180deg,#090b10,#06070a 65%,#020306);
  color:white;font-family:Arial,Helvetica,sans-serif}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.20;z-index:0;
  background-image:radial-gradient(rgba(255,255,255,.55) .65px,transparent .8px);
  background-size:5px 5px;mix-blend-mode:overlay
}
button{font:inherit}
.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;position:relative;z-index:1}
.topbar{
  min-height:78px;display:flex;align-items:center;gap:16px;padding:10px 18px;
  border-bottom:4px solid #000;background:
  linear-gradient(180deg,var(--red),var(--red2));
  box-shadow:0 3px 0 var(--yellow),0 8px 24px rgba(0,0,0,.45);
  position:sticky;top:0;z-index:40
}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.burst{
  width:52px;height:52px;display:grid;place-items:center;flex:0 0 auto;
  color:var(--ink);font-weight:1000;font-size:11px;text-align:center;line-height:.85;
  background:var(--yellow);
  clip-path:polygon(50% 0,58% 26%,76% 7%,74% 30%,100% 22%,81% 42%,100% 50%,80% 58%,100% 78%,73% 70%,76% 94%,58% 74%,50% 100%,42% 74%,24% 94%,27% 70%,0 78%,20% 58%,0 50%,19% 42%,0 22%,26% 30%,24% 7%,42% 26%);
  filter:drop-shadow(2px 3px 0 #000)
}
.titleblock{min-width:0}
.kicker{font-size:11px;font-weight:900;letter-spacing:.18em;color:var(--yellow)}
.logo{
  font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;
  font-style:italic;text-transform:uppercase;letter-spacing:.02em;
  font-size:clamp(23px,4vw,42px);line-height:.9;
  text-shadow:3px 3px 0 #000,-1px -1px 0 #000;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.issue{font-size:11px;font-weight:800;letter-spacing:.08em;opacity:.9;margin-top:3px}
.actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.iconbtn,.comicbtn{
  border:2px solid #000;box-shadow:2px 3px 0 #000;background:var(--cream);color:#111;
  font-weight:900;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;
}
.iconbtn{width:40px;height:40px;border-radius:3px;font-size:18px}
.comicbtn{padding:9px 12px;text-transform:uppercase;letter-spacing:.05em;font-size:12px}
.iconbtn:hover,.comicbtn:hover{transform:translate(-1px,-1px);box-shadow:4px 5px 0 #000}
.iconbtn:active,.comicbtn:active{transform:translate(1px,1px);box-shadow:1px 2px 0 #000}
.comicbtn.active{background:var(--yellow)}
.stage-wrap{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;min-height:0}
.sidehit{
  border:0;background:transparent;color:white;width:74px;cursor:pointer;z-index:5;
  font-size:58px;font-weight:900;text-shadow:3px 3px 0 #000;opacity:.38;
  transition:opacity .15s,background .15s
}
.sidehit:hover{opacity:1;background:linear-gradient(90deg,rgba(255,255,255,.08),transparent)}
.sidehit.right:hover{background:linear-gradient(270deg,rgba(255,255,255,.08),transparent)}
.stage{
  display:flex;align-items:center;justify-content:center;min-width:0;
  padding:28px 20px 30px;position:relative;perspective:1400px;overflow:auto;
}
.page-shell{
  transform-origin:center center;transition:transform .18s ease;
  position:relative;display:flex;gap:12px;align-items:center;justify-content:center;
  min-width:min-content
}
.page{
  background:#e8e0ca;border:3px solid #080808;box-shadow:var(--shadow);
  position:relative;overflow:hidden;transform-origin:center;
}
.page img{display:block;max-width:100%;max-height:calc(100vh - 180px);object-fit:contain}
.page:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.28), inset 0 0 45px rgba(62,35,10,.14)
}
.page-label{
  display:none;
  position:absolute;right:8px;bottom:8px;z-index:2;
  font:900 11px/1 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;
  color:#111;background:rgba(255,247,223,.92);border:2px solid #111;padding:5px 7px;
}
.cover-page{transform:rotate(-.25deg)}
.cover-page img{max-height:calc(100vh - 170px)}
.spread .page:first-child{transform:rotate(.25deg)}
.spread .page:last-child{transform:rotate(-.25deg)}
.thumbs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  transform:translateY(105%);transition:transform .22s ease;
  background:rgba(8,9,13,.96);border-top:3px solid var(--yellow);
  padding:12px 14px 16px;box-shadow:0 -14px 30px rgba(0,0,0,.55)
}
.thumbs.open{transform:translateY(0)}
.thumb-row{display:flex;gap:12px;overflow-x:auto;padding:3px 3px 5px}
.thumb{
  flex:0 0 auto;width:100px;background:#111;border:3px solid #343a48;cursor:pointer;
  padding:0;position:relative;box-shadow:3px 4px 0 #000
}
.thumb img{display:block;width:100%;height:78px;object-fit:cover}
.thumb span{display:block;color:white;font-size:10px;font-weight:900;padding:5px 4px;text-transform:uppercase}
.thumb.active{border-color:var(--yellow)}
.statusbar{
  min-height:54px;display:flex;align-items:center;gap:12px;padding:8px 16px;
  border-top:2px solid #282b35;background:#0d1017;position:relative;z-index:20
}
.status{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.progress{height:8px;border:2px solid #000;background:#2c303b;flex:1;min-width:80px;overflow:hidden}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--yellow));width:0}
.zoom-group{display:flex;align-items:center;gap:6px}
.zoom-readout{font:800 11px monospace;width:43px;text-align:center;color:#ddd}
.help{font-size:11px;color:#9fa4b1;white-space:nowrap}
.splash{
  position:absolute;left:24px;top:22px;z-index:7;pointer-events:none;
  background:var(--yellow);color:#111;border:3px solid #000;
  font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;
  font-size:17px;font-style:italic;text-transform:uppercase;letter-spacing:.03em;
  padding:8px 12px;transform:rotate(-2deg);box-shadow:4px 5px 0 #000
}
.hidden{display:none!important}
@media(max-width:820px){
  .topbar{min-height:66px;padding:8px 10px}
  .burst{width:42px;height:42px}
  .issue,.kicker{display:none}
  .actions .textaction{display:none}
  .stage-wrap{grid-template-columns:1fr}
  .sidehit{position:absolute;top:0;bottom:0;width:36px;font-size:32px;z-index:12}
  .sidehit:first-child{left:0}
  .sidehit.right{right:0}
  .stage{padding:18px 5px 70px}
  .page-shell.spread{flex-direction:column}
  .page img{max-height:none;max-width:92vw;width:auto;height:auto}
  .help{display:none}
  .statusbar{position:fixed;left:0;right:0;bottom:0}
  .splash{font-size:13px;left:10px;top:10px}
}
@media(max-width:520px){
  .logo{font-size:22px}
  .actions{gap:5px}
  .iconbtn{width:36px;height:36px}
  .page img{max-width:92vw}
  .status{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="burst">NEW<br>ISSUE!</div>
      <div class="titleblock">
        <div class="kicker">Celestial Comics Presents</div>
        <div class="logo">When Stars Collide</div>
        <div class="issue">Issue #1 · Friend, Foe, Lover?</div>
      </div>
    </div>
    <div class="actions">
      <button class="comicbtn textaction" id="spreadBtn" title="Toggle spread mode (S)">Spread</button>
      <button class="iconbtn" id="thumbBtn" title="Pages (T)">▦</button>
      <button class="iconbtn" id="fullscreenBtn" title="Fullscreen (F)">⛶</button>
    </div>
  </header>

  <main class="stage-wrap">
    <button class="sidehit" id="prevSide" aria-label="Previous page">‹</button>
    <section class="stage" id="stage">
      <div class="splash" id="splash">Issue #1 · Read from cover!</div>
      <div class="page-shell" id="pageShell" aria-live="polite"></div>
    </section>
    <button class="sidehit right" id="nextSide" aria-label="Next page">›</button>
  </main>

  <footer class="statusbar">
    <button class="comicbtn" id="prev">← Prev</button>
    <div class="status" id="status">Cover</div>
    <div class="progress"><i id="progressFill"></i></div>
    <div class="zoom-group">
      <button class="iconbtn" id="zoomOut" aria-label="Zoom out">−</button>
      <div class="zoom-readout" id="zoomReadout">100%</div>
      <button class="iconbtn" id="zoomIn" aria-label="Zoom in">+</button>
      <button class="comicbtn" id="fit">100%</button>
    </div>
    <button class="comicbtn" id="next">Next →</button>
    <div class="help">← → pages · S spread · T thumbnails · F fullscreen</div>
  </footer>
</div>

<div class="thumbs" id="thumbs">
  <div class="thumb-row" id="thumbRow"></div>
</div>

<script>
const pages = [{"id":0,"slug":"cover","label":"Cover","src":"pages/cover.png","width":1024,"height":1536},{"id":1,"slug":"title","label":"Inside Cover","src":"pages/title.png","width":1024,"height":1536},{"id":2,"slug":"page-1","label":"Page 1","src":"pages/pg1.png","width":1024,"height":1536},{"id":3,"slug":"page-2","label":"Page 2","src":"pages/pg2.png","width":1024,"height":1536},{"id":4,"slug":"page-3","label":"Page 3","src":"pages/pg3.png","width":1024,"height":1536}];
let current = 0;
let zoom = 1;
let spreadMode = window.matchMedia("(min-width: 1000px)").matches;
let thumbsOpen = false;

const stage = document.getElementById('stage');
const shell = document.getElementById('pageShell');
const statusEl = document.getElementById('status');
const progressEl = document.getElementById('progressFill');
const zoomEl = document.getElementById('zoomReadout');
const thumbs = document.getElementById('thumbs');
const thumbRow = document.getElementById('thumbRow');
const spreadBtn = document.getElementById('spreadBtn');
const splash = document.getElementById('splash');

function pairFor(index){
  if(index === 0) return [0];
  if(!spreadMode) return [index];
  if(index === 1 || index === 2) return [1,2];
  if(index === 3 || index === 4) return [3,4];
  return [index];
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function pageHtml(p, cover=false){
  return `<div class="page ${cover?'cover-page':''}">
    <img src="${p.src}" alt="${p.label}" draggable="false">
    <div class="page-label">${p.label}</div>
  </div>`;
}
function render(){
  current = clamp(current,0,pages.length-1);
  const pair = pairFor(current);
  shell.classList.toggle('spread', pair.length===2);
  shell.innerHTML = pair.map(i=>pageHtml(pages[i], i===0)).join('');
  shell.style.transform = `scale(${zoom})`;
  statusEl.textContent = pair.length===1 ? pages[pair[0]].label : `${pages[pair[0]].label} + ${pages[pair[1]].label}`;
  progressEl.style.width = `${((Math.max(...pair)+1)/pages.length)*100}%`;
  zoomEl.textContent = `${Math.round(zoom*100)}%`;
  spreadBtn.classList.toggle('active',spreadMode);
  document.querySelectorAll('.thumb').forEach((t,i)=>t.classList.toggle('active',pair.includes(i)));
  splash.classList.toggle('hidden',current!==0);
  preloadNearby(pair);
}
function preloadNearby(pair){
  const nums = new Set();
  pair.forEach(i=>{nums.add(i-1);nums.add(i+1)});
  nums.forEach(i=>{if(i>=0&&i<pages.length){const im=new Image();im.src=pages[i].src}});
}
function next(){
  if(spreadMode && current>0){
    if(current<=2) current=3;
    else current=pages.length-1;
  } else current++;
  if(current>=pages.length) current=pages.length-1;
  render();
}
function prev(){
  if(spreadMode && current>0){
    if(current>=3) current=1;
    else current=0;
  } else current--;
  if(current<0) current=0;
  render();
}
function go(i){current=i; render(); stage.scrollTo({top:0,left:0,behavior:'smooth'})}
function setZoom(v){zoom=clamp(v,.55,2.25);render()}
function toggleThumbs(){
  thumbsOpen=!thumbsOpen;
  thumbs.classList.toggle('open',thumbsOpen);
}
function toggleFullscreen(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
function toggleSpread(){
  spreadMode=!spreadMode;render();
}
pages.forEach((p,i)=>{
  const b=document.createElement('button');
  b.className='thumb';
  b.innerHTML=`<img src="${p.src}" alt=""><span>${p.label}</span>`;
  b.onclick=()=>{go(i); if(innerWidth<800) toggleThumbs()};
  thumbRow.appendChild(b);
});

document.getElementById('prev').onclick=prev;
document.getElementById('next').onclick=next;
document.getElementById('prevSide').onclick=prev;
document.getElementById('nextSide').onclick=next;
document.getElementById('zoomIn').onclick=()=>setZoom(zoom+.15);
document.getElementById('zoomOut').onclick=()=>setZoom(zoom-.15);
document.getElementById('fit').onclick=()=>setZoom(1);
document.getElementById('thumbBtn').onclick=toggleThumbs;
document.getElementById('fullscreenBtn').onclick=toggleFullscreen;
spreadBtn.onclick=toggleSpread;

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'){next();e.preventDefault()}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){prev();e.preventDefault()}
  if(e.key==='Home'){go(0);e.preventDefault()}
  if(e.key==='End'){go(pages.length-1);e.preventDefault()}
  if(e.key==='+'||e.key==='='){setZoom(zoom+.15)}
  if(e.key==='-'){setZoom(zoom-.15)}
  if(e.key.toLowerCase()==='f'){toggleFullscreen()}
  if(e.key.toLowerCase()==='t'){toggleThumbs()}
  if(e.key.toLowerCase()==='s'){toggleSpread()}
  if(e.key==='Escape'&&thumbsOpen) toggleThumbs();
});

let sx=null, sy=null;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
stage.addEventListener('pointerup',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.2){dx<0?next():prev()}
  sx=sy=null;
});

window.addEventListener('resize',()=>{
  if(innerWidth < 1000 && spreadMode){ spreadMode=false; render(); }
});

render();
</script>
</body>
</html>
